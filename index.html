<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文文本阅读难度分级</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2328; --ink2:#57606a; --ink3:#8b949e;
    --line:#e3e6ea; --accent:#2f6feb; --accent-soft:#eaf1fe;
    --l1:#7fb069; --l2:#a7c957; --l3:#f2c14e; --l4:#f4a259; --l5:#ef8354; --l6:#d95d63; --l7:#a2425c;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    font-size:14px; line-height:1.7;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
  header h1{font-size:21px;margin:0 0 6px;font-weight:600}
  header .formula{
    font-family:"Cambria Math",Georgia,serif;background:var(--accent-soft);color:#1b4bab;
    padding:6px 12px;border-radius:6px;display:inline-block;font-size:13px;margin-bottom:6px;
  }
  header .src{color:var(--ink3);font-size:12.5px}
  .grid{display:grid;grid-template-columns:minmax(340px,5fr) minmax(420px,7fr);gap:20px;margin-top:22px}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:11px;font-weight:400;color:var(--ink3)}
  textarea{
    width:100%;min-height:260px;resize:vertical;padding:12px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;line-height:1.8;font-family:inherit;color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{
    background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 20px;
    font-size:14px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{background:#2559c4}
  .btn:disabled{background:#b6c4e0;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f0f2f5}
  .muted{color:var(--ink3);font-size:12.5px}
  .opts{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .opts label{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer;color:var(--ink2);font-size:13px}
  .opts input{margin-top:4px}
  /* ---------- 结果 ---------- */
  #result{display:none}
  .score-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .score-num{font-size:52px;font-weight:600;letter-spacing:-1px;line-height:1}
  .score-num small{font-size:15px;color:var(--ink3);font-weight:400;margin-left:6px}
  .grade-badge{
    font-size:20px;font-weight:600;color:#fff;padding:8px 20px;border-radius:999px;
  }
  .grade-ref{font-size:12.5px;color:var(--ink2);margin-top:6px}
  .bandbar{position:relative;height:10px;background:#eceff3;border-radius:5px;margin:16px 0 6px}
  .bandbar .pin{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
  .bandscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
  .dims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .dim{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .dim .nm{font-size:12px;color:var(--ink3)}
  .dim .vl{font-size:20px;font-weight:600;margin-top:2px}
  .dim .sub{font-size:11.5px;color:var(--ink3)}
  /* 分布图 */
  .chart{margin-top:10px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .bar-lab{width:44px;font-size:12px;color:var(--ink2);text-align:right;flex:none}
  .bar-track{flex:1;height:16px;background:#f0f2f5;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .35s ease}
  .bar-val{width:86px;font-size:12px;color:var(--ink2);flex:none}
  .lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}
  .lv4{background:var(--l4)}.lv5{background:var(--l5)}.lv6{background:var(--l6)}.lv7{background:var(--l7)}
  /* 清单 */
  details{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}
  details summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
  details .body{padding:0 14px 12px;max-height:330px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--ink3);font-weight:500;font-size:12px;position:sticky;top:0;background:#fafbfc}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-size:12.5px;color:var(--ink2)}
  .chip.hi{background:#fdeee9;border-color:#f3c9bd;color:#a2425c}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
  .note{background:#fff8e6;border:1px solid #f2dfae;color:#7a5b13;border-radius:6px;padding:8px 12px;font-size:12.5px;margin-top:12px}
  .err{background:#fdecec;border:1px solid #f3c2c2;color:#a2425c;border-radius:6px;padding:10px 12px;font-size:13px}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sample{font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline}
  /* ---------- 分析过程 ---------- */
  .steps{border:1px solid var(--line);border-radius:8px;background:#fafbfc;padding:12px 14px}
  .step{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--ink3)}
  .step .sn{flex:none}
  .step .sd{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right}
  .step .dot{width:10px;height:10px;border-radius:50%;background:#d7dbe0;flex:none}
  .step.done{color:var(--ink)}
  .step.done .dot{background:var(--l1)}
  .step.run{color:var(--accent);font-weight:600}
  .step.run .dot{background:var(--accent);animation:pulse .9s ease-in-out infinite}
  .step.run .sd{color:var(--accent)}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l1);margin-right:5px}
  .ok{color:#2f7d32}
</style>
</head>
<body>
<noscript>
  <div style="background:#a2425c;color:#fff;padding:12px 20px;font-size:14px">
    当前环境禁用了 JavaScript，本页无法计算难度。请在正常浏览器窗口中打开本文件（双击文件即可），
    或到浏览器设置里允许本页运行脚本。
  </div>
</noscript>
<div class="wrap">
  <header>
    <h1>中文文本阅读难度分级</h1>
    <div class="formula">难度 = (1/3) × Σ<sub>n=1..7</sub> n × [ r<sub>字</sub>(n) + r<sub>词</sub>(n) + r<sub>语法</sub>(n) ]</div>
    <div class="src">
      依据程勇、董军、晋淑华《基于新标准的汉语二语文本阅读难度分级体系构建与应用》（《世界汉语教学》2023 年第 1 期），
      分级数据取自《国际中文教育中文水平等级标准》(GF&nbsp;0025-2021)：汉字 3000、词汇 11092、语法 572 条。
    </div>
    <div class="src" id="engineInfo"></div>
  </header>

  <div class="grid">
    <!-- 输入 -->
    <div class="card">
      <h2>输入文本 <span class="tag">粘贴或输入一段中文</span></h2>
      <textarea id="text" placeholder="在此粘贴中文文本……"></textarea>
      <div class="row">
        <button class="btn" id="run">开始分析</button>
        <button class="btn ghost" id="clear">清空</button>
        <span class="muted" id="counter">0 字</span>
        <span class="sample" id="fillSample">填入示例</span>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="optChars" checked>
          <span>表外字计入第 7 级<small class="muted">（不在 3000 字表内的字视为七—九级）</small></span></label>
        <label><input type="checkbox" id="optWords">
          <span>表外词计入第 7 级<small class="muted">（默认关闭：分词产生的专名、切分碎片不计入难度）</small></span></label>
      </div>
    </div>

    <!-- 结果 -->
    <div class="card" id="result">
      <h2>分析结果</h2>
      <div id="out"></div>
    </div>
    <div class="card" id="placeholder">
      <h2>分析结果</h2>
      <div class="muted">在左侧输入文本后点击「开始分析」，这里会显示难度分数、评级，以及字／词／语法三个维度的级别分布。</div>
    </div>
  </div>

    function makeMatcher(dict, maxLen) {

        while (i < n) {
          hit = null;
          for (L = Math.min(maxLen, n - i); L > 1; L--) {
            if (dict.has(s.substr(i, L))) { hit = s.substr(i, L); break; }
          }
          if (hit) { out.push(hit); i += hit.length; continue; }
          if (dict.has(s[i])) { out.push(s[i]); i += 1; continue; }
          // 未登录串：一直扩到下一个"能识别"的位置为止

          while (j < n) {
            if (dict.has(s[j])) break;
            can = false;
            for (L = Math.min(maxLen, n - j); L > 1; L--) {
              if (dict.has(s.substr(j, L))) { can = true; break; }
            }
            if (can) break;
            j++;

    var fwd = makeMatcher(segSet, maxWordLen);

    function fmm(s) { return fwd(s); }

    function bmm(s) {

    function splitSentences(text) {

    // ------------------------------------------------------------------ //
    // 语法点识别
    // ------------------------------------------------------------------ //
    function detect(name, ctx) {

      switch (name) {
        case 'ever': return sents.length > 0;
        case 'declarative': return text.indexOf('。') >= 0 || sents.length > 0;
        case 'interrogative':
          if (text.indexOf('？') >= 0 || text.indexOf('?') >= 0) return true;
          for (i = 0; i < QUESTION_WORDS.length; i++) if (text.indexOf(QUESTION_WORDS[i]) >= 0) return true;

        case 'attributive': return text.indexOf('的') >= 0;
        case 'adverbial':
          if (text.indexOf('地') >= 0) return true;
          for (i = 0; i < tokens.length; i++) if (ADVERB_TOKENS.indexOf(tokens[i]) >= 0) return true;

    /** 把一次分析拆成 6 个阶段，便于界面显示实时进度。 */

            }
            st.charTypes = types;
            st.sentences = splitSentences(st.text);
            st.detail = '汉字 ' + hanzi.length + ' 个 · 字种 ' + types.length + ' · 句子 ' + st.sentences.length + ' 句';
          }
        },
        {
          name: '② 汉字维度：按 3000 字表统计字种级别',
          run: function () {

            }

            st.detail = st.charDim.total + ' 个字种 · Σn×r(n) = ' + st.charDim.expectation.toFixed(3)
              + (oov.length ? ' · 表外字 ' + oov.length : '');
          }
        },
        {
          name: '③ 分词：词典双向最大匹配',
          run: function () {
            st.tokens = cut(st.text);
            st.detail = '切出 ' + st.tokens.length + ' 个词 token';
          }
        },
        {
          name: '④ 词汇维度：按 11092 词表统计词种级别',
          run: function () {

            st.wordDim = buildDimension('词汇', counts, oov, st.oovWordsToTop);
            st.detail = st.wordDim.total + ' 个词种 · Σn×r(n) = ' + st.wordDim.expectation.toFixed(3)
              + (oov.length ? ' · 表外词 ' + oov.length : '');
          }
        },
        {
          name: '⑤ 语法维度：匹配 ' + rules.length + ' 条语法规则',
          run: function () {

            for (i = 0; i < st.hits.length; i++) counts[st.hits[i].level] = (counts[st.hits[i].level] || 0) + 1;
            st.gramDim = buildDimension('语法', counts, [], false);
            st.detail = '命中 ' + st.hits.length + ' 类语法点 · Σn×r(n) = ' + st.gramDim.expectation.toFixed(3);
          }
        },
        {
          name: '⑥ 按论文公式合成难度分与评级',
          run: function () {
            var dims = [st.charDim, st.wordDim, st.gramDim];
            var valid = [], i;
            for (i = 0; i < dims.length; i++) if (dims[i].total > 0) valid.push(dims[i]);
            var score = 0, grade = null, note = '';

                var missing = [];

              }
            }

            st.out = {
              score: score,
              grade: grade,
              grade_reference: grade ? (HSK_REFERENCE[grade.level] || '') : '',
              note: note,
              dimensions: { '汉字': st.charDim, '词汇': st.wordDim, '语法': st.gramDim },
              per_dimension: {
                '汉字': st.charDim.expectation, '词汇': st.wordDim.expectation, '语法': st.gramDim.expectation
              },
              stats: {
                text_length: st.text.length,
                hanzi_count: st.hanzi.length,
                char_types: st.charTypes.length,
                word_tokens: st.tokens.length,
                word_types: st.wordFreq.size,
                sentence_count: st.sentences.length,
                grammar_point_types: st.hits.length,
                oov_char_types: st.oovChars.length,
                oov_word_types: st.oovWords.length
              },
              details: {
                grammar_hits: st.hits.map(function (h) {
                  return { level: h.level, label: h.label, desc: h.desc, evidence: h.evidence };
                }),
                advanced_words: st.advanced,
                out_of_list_chars: st.oovChars.slice(0, 200),
                out_of_list_words: st.oovWords.slice(0, 200)

      return { stages: stages, st: st, result: function () { return st.out; } };

    /** 同步分析（脚本 / Node 用）。onStep 可选。 */

    /** 异步分析：每个阶段之间让出主线程，界面可实时显示进度。 */

      analyzeAsync: analyzeAsync,

      meta: {

        word_count: wordLevel.size,
        seg_count: segSet.size,
        rule_count: rules.length,
        formula: '难度 = (1/3) × Σ(n=1..7) n × [r字(n) + r词(n) + r语法(n)]',
        source: '程勇、董军、晋淑华《基于新标准的汉语二语文本阅读难度分级体系构建与应用》，《世界汉语教学》2023 年第 1 期'

/* 页面交互：全部计算在本地浏览器完成，不联网、不依赖后端。 */

  var SAMPLE = '随着生活水平的提高，越来越多的人开始关注健康问题。\n'
    + '有人认为，只要坚持锻炼，就能保持身体健康；也有人觉得，合理的饮食更加重要。\n'
    + '其实，这两方面都不可缺少。我们应该根据自己的实际情况，制定合适的计划，并且长期坚持下去，才会收到良好的效果。';

  // ------------------------------------------------------------------ //

  function showError(e) {

  // ------------------------------------------------------------------ //

      var pct = c / total * 100;

      rows += '<div class="bar-row">'
        + '<div class="bar-lab">' + name + '</div>'

  function render(data, timing) {

    var color = GRADE_COLOR[g.level] || '#8b949e';
    var dims = data.dimensions;

    var html = ''
      + '<div class="score-hero">'
      + '<div><div class="score-num">' + data.score.toFixed(3) + '<small>分</small></div></div>'
      + '<div><span class="grade-badge" style="background:' + color + '">' + (g.name || '-') + '</span>'
      + '<div class="grade-ref">' + escapeHtml(data.grade_reference || '') + '</div></div>'
      + '</div>'
      + '<div class="bandbar"><div class="pin" style="left:'

      + '<div class="bandscale"><span>1.0</span><span>1.4</span><span>1.75</span><span>2.0</span>'
      + '<span>2.3</span><span>2.55</span><span>2.7</span><span>3.5+</span></div>'
      + '<div class="dims">'

      + '</div>';

    if (data.note) html += '<div class="note">' + escapeHtml(data.note) + '</div>';

    html += '<details open><summary>字／词／语法各级别分布</summary><div class="body">'
      + barChart('汉字', dims['汉字'])
      + '<div style="height:10px"></div>'
      + barChart('词汇', dims['词汇'])
      + '<div style="height:10px"></div>'
      + barChart('语法', dims['语法'])
      + '</div></details>';

    var d = data.details || {};
    if (d.advanced_words && d.advanced_words.length) {
      html += '<details><summary>高级别词语（五级及以上，共 ' + d.advanced_words.length + ' 个）</summary>'
        + '<div class="body"><table><thead><tr><th>词语</th><th>级别</th><th>出现次数</th></tr></thead><tbody>'
        + d.advanced_words.map(function (w) {
          return '<tr><td>' + escapeHtml(w.word) + '</td><td>' + w.level_name + '</td><td>' + w.freq + '</td></tr>';
        }).join('')
        + '</tbody></table></div></details>';
    }

    if (d.grammar_hits && d.grammar_hits.length) {
      html += '<details><summary>识别到的语法点（共 ' + d.grammar_hits.length + ' 类）</summary>'
        + '<div class="body"><table><thead><tr><th>级别</th><th>语法点</th><th>命中证据</th></tr></thead><tbody>'
        + d.grammar_hits.map(function (h) {
          return '<tr><td>' + (h.level === 7 ? '七—九' : h.level) + '</td><td>' + escapeHtml(h.label)
            + '</td><td>' + escapeHtml(h.evidence) + '</td></tr>';
        }).join('')
        + '</tbody></table></div></details>';
    }

    if ((d.out_of_list_chars && d.out_of_list_chars.length) || (d.out_of_list_words && d.out_of_list_words.length)) {
      html += '<details><summary>表外字 / 表外词</summary><div class="body">'
        + '<div class="muted" style="margin:6px 0">表外字（不在 3000 字表内，共 ' + d.out_of_list_chars.length + ' 个）</div>'
        + chipList(d.out_of_list_chars.slice(0, 150), 'hi')
        + '<div class="muted" style="margin:12px 0 6px">表外词（不在 11092 词表内，共 ' + d.out_of_list_words.length + ' 个）</div>'
        + chipList(d.out_of_list_words.slice(0, 150))
        + '</div></details>';
    }

    var s = data.stats;
    html += '<div class="stats">'
      + '<span>字符数 ' + s.text_length + '</span><span>汉字数 ' + s.hanzi_count + '</span>'
      + '<span>字种 ' + s.char_types + '</span><span>词种 ' + s.word_types + '</span>'
      + '<span>句数 ' + s.sentence_count + '</span><span>语法点 ' + s.grammar_point_types + ' 类</span>'
      + '</div>';

    if (timing) {
      html += '<div class="muted" style="margin-top:8px">分析完成：实际计算 '
        + timing.computeMs + ' ms（分步展示共 ' + timing.wallMs + ' ms，其中大部分是刻意留的展示间隔）</div>';
    }

    $('#out').innerHTML = html;
    $('#result').style.display = 'block';
    $('#placeholder').style.display = 'none';

    // 窄窗口下结果卡会排到输入区下方（屏幕外），自动滚过去，避免"点了没反应"的错觉
    scrollToResult();
  }

  function dimCell(name, dim) {
    var unit = { '汉字维度': '个字种', '词汇维度': '个词种', '语法维度': '类语法点' }[name];
    return '<div class="dim"><div class="nm">' + name + '</div>'
      + '<div class="vl">' + dim.expectation.toFixed(2) + '</div>'
      + '<div class="sub">' + dim.total + ' ' + unit + '</div></div>';
  }

  // ------------------------------------------------------------------ //
  // 事件
  // ------------------------------------------------------------------ //
  function updateCounter() { $('#counter').textContent = $('#text').value.length + ' 字'; }

  function bind() {
    $('#fillSample').onclick = function () { $('#text').value = SAMPLE; updateCounter(); };
    $('#clear').onclick = function () {
      $('#text').value = ''; updateCounter();
      $('#result').style.display = 'none'; $('#placeholder').style.display = '';
    };
    $('#text').oninput = updateCounter;

    // 支持 Ctrl / Cmd + Enter 直接分析
    $('#text').addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('#run').click(); }
    });

    $('#run').onclick = function () {
      var text = $('#text').value.trim();
      if (!text) { alert('请先输入中文文本'); return; }

      var btn = $('#run');
      var wall0 = nowMs();
      var computeMs = 0;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>分析中';

      var engine;
      try {
        engine = getEngine();
        showProgress(engine.stageNames());
      } catch (e) {
        resetBtn(btn);
        showError(e);
        return;
      }

      engine.analyzeAsync(
        text,
        { oov_chars_to_top: $('#optChars').checked, oov_words_to_top: $('#optWords').checked },
        function (ev) {
          if (ev.phase === 'done' && ev.ms != null) computeMs += ev.ms;
          markStep(ev);
        },
        140
      ).then(function (data) {
        render(data, { computeMs: Math.round(computeMs * 100) / 100, wallMs: Math.round((nowMs() - wall0) * 10) / 10 });
      }).catch(function (e) {
        showError(e);
      }).then(function () {
        resetBtn(btn);
      });
    };

    // 显示内置数据量，便于确认数据已就绪
    try {
      var m = getEngine().meta;
      var el = document.getElementById('engineInfo');
      if (el) {
        el.innerHTML = '<span class="ok-dot"></span><b class="ok">分级引擎已就绪</b>　'
          + '内置汉字 ' + m.char_count + ' / 词汇 ' + m.word_count + ' / 语法规则 ' + m.rule_count
          + '；全部计算在浏览器本地完成，无需联网。';
      }
    } catch (e) {
      var el2 = document.getElementById('engineInfo');
      if (el2) { el2.innerHTML = '<span style="color:#a2425c">数据未能加载：' + escapeHtml(e.message) + '</span>'; }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();

</script>
</body>
</html>
